name: Release preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, such as v0.2.0
        required: true
        type: string
      publish_existing_draft:
        description: Publish the existing runtime-verified candidate without rebuilding
        type: boolean
        default: false
      manifest_sha256:
        description: SHA256 of the candidate manifest used for runtime acceptance (required for publication)
        type: string
      make_latest:
        description: Publish the accepted draft as the Latest release
        type: boolean
        default: false

concurrency:
  group: mac-release
  queue: max

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.candidate.outputs.tag || steps.tag.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit || steps.tag.outputs.commit }}
      build_number: ${{ steps.candidate.outputs.build_number || steps.tag.outputs.build_number }}
      override: ${{ steps.candidate.outputs.override || steps.tag.outputs.override }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version at the successful main CI commit
        if: github.event_name == 'workflow_run'
        id: candidate
        env:
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release.py plan --commit "$CI_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Validate the existing version tag
        if: github.event_name != 'workflow_run'
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    if: needs.validate.outputs.tag != '' && !inputs.publish_existing_draft
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      asset-id: ${{ steps.assets.outputs.artifact-id }}
    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the validated release commit
        run: python3 scripts/check.py unit
      - name: Build and verify certificate-free Mac assets
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          RELEASE_OVERRIDE: ${{ needs.validate.outputs.override }}
        run: |
          if [[ "$RELEASE_OVERRIDE" == 'true' ]]; then
            python3 scripts/release.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --build-number "$RELEASE_BUILD_NUMBER" --asset-dir dist
          else
            python3 scripts/release.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --asset-dir dist
          fi
      - name: Retain only verified release assets
        id: assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release-assets-${{ github.run_attempt }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Mac assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.asset-id }}
          path: dist
      - name: Upload and verify a candidate draft
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --build-number "$RELEASE_BUILD_NUMBER" --asset-dir dist

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing_draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and publish the accepted candidate
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --manifest-sha256 "$CANDIDATE_MANIFEST_SHA256")
          if [[ "$MAKE_LATEST" == 'true' ]]; then
            args+=(--make-latest)
          fi
          python3 scripts/release.py publish "${args[@]}"
