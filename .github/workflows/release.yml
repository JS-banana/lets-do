name: Release preview

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the existing tag before accessing signing secrets
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  sign:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the validated release commit before accessing signing secrets
        run: python3 scripts/check.py unit
      - name: Build and verify signed desktop assets
        env:
          RELEASE_SIGNING_DIR: ${{ runner.temp }}/lets-do-signing-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          M0_BUNDLE_PREFIX: ${{ vars.MACOS_BUNDLE_PREFIX || 'com.panion.todo.m0' }}
          CODE_SIGN_IDENTITY: ${{ vars.MACOS_CODE_SIGN_IDENTITY || 'Apple Development' }}
        run: python3 scripts/release.py package --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --asset-dir dist
      - name: Remove temporary signing material
        if: always()
        env:
          RELEASE_SIGNING_DIR: ${{ runner.temp }}/lets-do-signing-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/release.py cleanup
      - name: Retain only verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-assets
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, sign]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified desktop assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-assets
          path: dist
      - name: Upload all assets to a draft, verify, then publish the preview
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --asset-dir dist
