name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [unit, build, cloud-build, desktop-compile, distribution-build]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Run project checks
        run: python3 scripts/check.py "${{ matrix.check }}"
      - name: Retain check summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.check }}
          path: .build/checks/**/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
